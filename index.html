<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диспетчерская панель</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      color: #0f172a;
      min-height: 100vh;
    }

    .app-screen {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 20px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .app-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }

    .content-padding {
      padding: 16px;
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .screen-page {
      display: none;
    }

    .screen-page.active {
      display: block;
    }

    .section-title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      margin: 12px 0 20px 0;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .driver-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .driver-btn {
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      padding: 20px 22px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      border-left: 8px solid #f59e0b;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease;
      text-align: left;
    }

    .driver-btn:active {
      background: #f59e0b;
      color: #ffffff;
      transform: scale(0.98);
    }

    .driver-btn::after {
      content: '➔';
      color: #6366f1;
      font-size: 24px;
      font-weight: 900;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .driver-btn:active::after {
      color: #ffffff;
    }

    .back-btn {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      border: none;
      padding: 18px 24px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.4);
      transition: transform 0.1s ease;
    }

    .back-btn:active {
      transform: scale(0.98);
    }

    .info-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      border-left: 8px solid #3b82f6;
    }

    .info-card p {
      margin: 14px 0;
      line-height: 1.5;
      font-size: 20px;
      color: #1e293b;
    }

    .info-card strong {
      color: #1e3a8a;
      font-weight: 900;
    }

    .status-msg {
      text-align: center;
      color: #ffffff;
      padding: 40px 20px;
      font-size: 22px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      border: 2px dashed rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    <div class="app-header">
      <span style="font-size:32px;">🚛</span>
      <h1>Диспетчерская</h1>
    </div>

    <div class="content-padding">
      <div id="loader" class="status-msg">⏳ Загрузка данных...</div>

      <div id="page-list" class="screen-page">
        <div class="section-title">👤 Выберите водителя / заявку:</div>
        <div id="driver-list-container" class="driver-list"></div>
      </div>

      <div id="page-details" class="screen-page">
        <button class="back-btn" onclick="openListPage()">
          <span>⬅️ Вернуться к списку</span>
        </button>
        <div id="driver-details-content"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxlSHdkO8OWYtCwpdkIrwtrwzj17j_AI_svixpz-7i9TsvHuid18TRjamjIz3OVN8d75g/exec";
    let tableData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        tableData = await response.json();

        if (tableData.error) {
          document.getElementById("loader").innerHTML = "❌ " + tableData.error;
          return;
        }

        renderDriverList();
        document.getElementById("loader").style.display = "none";
        document.getElementById("page-list").classList.add("active");
      } catch (err) {
        document.getElementById("loader").innerHTML = "❌ Ошибка загрузки данных. Проверьте ссылку API.";
      }
    }

    function isFilled(val) {
      if (val === null || val === undefined) return false;
      const str = String(val).trim();
      return str !== "" && str !== "0" && str !== "0.0";
    }

    // Возвращает чистый текст из первой ячейки (столбец 0 / A)
    function getCellText(i) {
      if (isFilled(tableData[i][0])) {
        return String(tableData[i][0]).trim();
      }
      return "";
    }

    function renderDriverList() {
      let driversSet = new Set();
      let unassignedList = [];

      for (let i = 1; i < tableData.length; i++) {
        let driverName = tableData[i][13];
        if (driverName && String(driverName).trim() !== "") {
          driversSet.add(String(driverName).trim());
        } else {
          let destination = isFilled(tableData[i][6]) ? String(tableData[i][6]).trim() : "Пункт не указан";
          unassignedList.push({ rowIndex: i, destination: destination });
        }
      }

      let sortedDrivers = Array.from(driversSet).sort();
      const container = document.getElementById("driver-list-container");

      let html = "";

      // Вывод нераспределенных заявок
      unassignedList.forEach(item => {
        html += `
          <button class="driver-btn" style="border-left-color: #ef4444;" onclick="openUnassignedPage(${item.rowIndex})">
            <span style="color: #dc2626; font-weight: 900;">⚠️ Не распределено / ${item.destination}</span>
          </button>
        `;
      });

      // Вывод распределенных водителей
      html += sortedDrivers.map(driver => `
        <button class="driver-btn" onclick="openDriverPage('${driver.replace(/'/g, "\\'")}')">
          <span>👤 ${driver}</span>
        </button>
      `).join('');

      container.innerHTML = html;
    }

    function renderRecordCard(i, isUnassigned = false) {
      let cardBorderStyle = isUnassigned ? 'border-left: 8px solid #ef4444;' : '';
      let html = '<div class="info-card" style="' + cardBorderStyle + '">';
      
      let firstCellContent = getCellText(i);
      if (firstCellContent) {
        html += '<p><strong>📌 Дата:</strong> ' + firstCellContent + '</p>';
      }

      let dep = isFilled(tableData[i][3]) ? String(tableData[i][3]).trim() : "";
      let fio = isFilled(tableData[i][4]) ? String(tableData[i][4]).trim() : "";
      let depFio = "";
      if (dep && fio) { depFio = dep + " / " + fio; }
      else if (dep) { depFio = dep; }
      else if (fio) { depFio = fio; }
      
      if (depFio) {
        html += '<p><strong>🏢 Подразделение / ФИО:</strong> ' + depFio + '</p>';
      }

      if (isFilled(tableData[i][6])) {
        html += '<p><strong>📍 Пункт назначения:</strong> ' + tableData[i][6] + '</p>';
      }
      
      if (isFilled(tableData[i][7])) {
        html += '<p><strong>📝 Примечания:</strong> ' + tableData[i][7] + '</p>';
      }
      
      if (isFilled(tableData[i][8])) {
        html += '<p><strong>📦 Габариты:</strong> ' + tableData[i][8] + '</p>';
      }
      
      if (isFilled(tableData[i][9])) {
        html += '<p><strong>⚖️ Вес:</strong> ' + tableData[i][9] + ' кг</p>';
      }
      
      if (isFilled(tableData[i][10])) {
        html += '<p><strong>👥 Пассажиры:</strong> ' + tableData[i][10] + ' чел.</p>';
      }
      
      if (isFilled(tableData[i][12])) {
        html += '<p><strong>🚗 Гос. номер:</strong> ' + tableData[i][12] + '</p>';
      }

      html += '</div>';
      return html;
    }

    function openDriverPage(driverName) {
      const listPage = document.getElementById("page-list");
      const detailsPage = document.getElementById("page-details");
      const detailsContent = document.getElementById("driver-details-content");

      let html = '<div class="section-title">🚚 Водитель: ' + driverName + '</div>';
      let foundRecords = false;

      for (let i = 1; i < tableData.length; i++) {
        if (String(tableData[i][13]).trim() === driverName) {
          foundRecords = true;
          html += renderRecordCard(i, false);
        }
      }

      if (!foundRecords) {
        html += '<div class="status-msg">По этому водителю нет активных заявок.</div>';
      }

      detailsContent.innerHTML = html;
      listPage.classList.remove("active");
      detailsPage.classList.add("active");
      window.scrollTo(0, 0);
    }

    function openUnassignedPage(rowIndex) {
      const listPage = document.getElementById("page-list");
      const detailsPage = document.getElementById("page-details");
      const detailsContent = document.getElementById("driver-details-content");

      let destination = isFilled(tableData[rowIndex][6]) ? String(tableData[rowIndex][6]).trim() : "Пункт не указан";
      let html = '<div class="section-title" style="color: #ef4444;">⚠️ Не распределено / ' + destination + '</div>';
      
      html += renderRecordCard(rowIndex, true);

      detailsContent.innerHTML = html;
      listPage.classList.remove("active");
      detailsPage.classList.add("active");
      window.scrollTo(0, 0);
    }

    function openListPage() {
      document.getElementById("page-details").classList.remove("active");
      document.getElementById("page-list").classList.add("active");
      window.scrollTo(0, 0);
    }

    loadData();
  </script>
</body>
</html>
